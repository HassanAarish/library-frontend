<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)" />
    <title>LibraryHub: rent and read books online</title>
    <meta
      name="description"
      content="Rent books online in Pakistan. Browse the catalogue, book a title for now or later, and read it in your browser."
    />
    <!-- Link previews (WhatsApp, Facebook, X) don't run JS, so the defaults live here;
         useSeo updates them per page for crawlers that do. __SITE_URL__ is filled at build. -->
    <meta property="og:site_name" content="LibraryHub" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LibraryHub: rent and read books online" />
    <meta
      property="og:description"
      content="Rent books online in Pakistan. Browse the catalogue, book a title for now or later, and read it in your browser."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Apply the saved/system theme before first paint (no light→dark flash). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (editorial serif) + Inter (UI). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
